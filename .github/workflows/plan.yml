name: "Terraform Plan & Diagram"

on:
  # pull_request:
  #   types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to plan (dev, staging, prod)"
        required: true
        default: "dev"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    name: "Terraform Plan & Generate Diagram"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@6fc4af4b145ae7821d527454aa9bd537d1f2dc5f # v2
        continue-on-error: true
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.1"

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Plan
        id: plan
        continue-on-error: true
        run: |
          terraform plan -no-color -out=tfplan.binary || true
          if [ -f tfplan.binary ]; then
            terraform show -json tfplan.binary > plan.json
          fi

      - name: Render Cloud Architecture Diagram
        run: |
          if [ -f plan.json ]; then
            npx -y tf-arch-diagram-generator render plan.json --out docs/architecture.svg
          else
            echo "Plan JSON not available, skipping diagram generation."
          fi

      - name: Upload Diagram Artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: architecture-diagram
          path: docs/architecture.svg
          if-no-files-found: ignore

      - name: Comment Plan Summary on PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const body = `### 🌐 Google Cloud GKE Infrastructure Plan & Diagram Summary
            - **Terraform Core**: \`>= 1.16.1\`
            - **Target Cloud**: Google Cloud Platform (GCP)
            - **Diagram Tool**: [tf-arch-diagram-generator](https://github.com/mchittineni/tf-arch-diagram-generator)
            - **Architecture Diagram**: Generated and attached as workflow artifact \`architecture-diagram\`.
            
            *Automated CI check triggered by commit \`${context.sha.substring(0, 7)}\`*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
