name: "Generate Architecture Diagram"

on:
  workflow_dispatch:
  # push:
  #   paths:
  #     - "**/*.tf"
  #     - "!docs/**"

permissions:
  contents: write

jobs:
  generate:
    name: "Render Architecture Diagram"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.1"

      - name: Render Diagram
        run: |
          mkdir -p docs
          if [ -f plan.json ]; then
            npx -y tf-arch-diagram-generator render plan.json --out docs/architecture.svg
          fi

      - name: Commit Updated Diagram
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/architecture.svg
          if git diff --staged --quiet; then
            echo "No diagram changes detected."
          else
            git commit -m "chore(diagram): regenerate cloud architecture diagram [skip ci]"
            git push
          fi
